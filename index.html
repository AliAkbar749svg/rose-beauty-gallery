<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری زیبایی رز | Rose Beauty Gallery - فروشگاه بزرگ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- هدر و نوار بالایی سایت -->
    <header class="main-header">
        <div class="logo-area">
            <h1>گالری زیبایی رز</h1>
            <p>بزرگترین مرجع تخصصی لوازم آرایشی و لوکس (بیش از ۱۰۰۰ محصول)</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجوی پیشرفته در میان محصولات...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="cart-icon" id="cartBtn">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- منوی دسته‌بندی‌ها -->
    <nav class="categories-nav">
        <button class="cat-btn active" data-category="all">همه محصولات</button>
        <button class="cat-btn" data-category="makeup">آرایشی لب و صورت</button>
        <button class="cat-btn" data-category="skincare">مراقبت پوست</button>
        <button class="cat-btn" data-category="perfume">عطر و ادکلن لوکس</button>
        <button class="cat-btn" data-category="hair">مراقبت مو</button>
    </nav>

    <!-- بخش نمایش محصولات (گرید با تعداد ستون‌های بالا و جذاب) -->
    <main class="container">
        <div class="products-grid" id="productsGrid">
            <!-- محصولات به صورت خودکار توسط جاوااسکریپت (بیش از ۹۹۹ عدد) اینجا بارگذاری می‌شوند -->
        </div>
    </main>

    <!-- سبد خرید کشویی -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>سبد خرید شما</h3>
            <i class="fa-solid fa-xmark" id="closeCart"></i>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- محصولات انتخاب شده -->
        </div>
        <div class="cart-footer">
            <div class="total-price">مجموع: <span id="totalPrice">۰</span> تومان</div>
            <button class="checkout-btn">تکمیل خرید و پرداخت</button>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
